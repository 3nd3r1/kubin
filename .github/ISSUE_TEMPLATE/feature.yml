name: Feature
description: A user-facing feature or improvement.
labels: ["type:feature"]
body:
  - type: textarea
    attributes:
      label: "User Story"
      description: "Follow the 'As a → I want → So that' format."
      placeholder: |
        As a [user role], I want [feature], so that [benefit].
        Example:
        As a developer, I want `kubin create --output ./snapshot.tgz`, so I can test deployments safely.
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Acceptance Criteria"
      description: "Minimum requirements to close this issue."
      placeholder: |
        - [ ] Criteria 1 (e.g., "Command supports `--dry-run` flag")
        - [ ] Criteria 2 (e.g., "Logs output to stdout")
  - type: dropdown
    id: component
    attributes:
      label: "Component"
      multiple: true
      options:
        - "CLI"
        - "Server"
        - "UI"
        - "Deploy"
  - type: textarea
    attributes:
      label: "Additional Context"
      placeholder: "Screenshots, links, or technical notes."
