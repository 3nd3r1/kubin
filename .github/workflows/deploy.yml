name: Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - "ui/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy or roll back to (leave empty to build current main)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hosted
      cancel-in-progress: false
    steps:
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${SHA:0:7}"
            echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.tag.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.tag.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.tag.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/3nd3r1/kubin:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag and deploy on Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          for var in COOLIFY_URL COOLIFY_APP_UUID COOLIFY_API_TOKEN; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required GitHub secret: $var" >&2
              exit 1
            fi
          done
          BASE="${COOLIFY_URL%/}"

          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_tag\":\"${IMAGE_TAG}\"}" \
            "${BASE}/api/v1/applications/${COOLIFY_APP_UUID}" >/dev/null

          curl -fsS -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${BASE}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=true" >/dev/null

      - name: Verify readiness
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS https://kubin.ender.fi/readyz 2>/dev/null || true)" = "ok" ]; then
              echo "kubin.ender.fi is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for https://kubin.ender.fi/readyz" >&2
          exit 1
