apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: kubin-development

build:
  artifacts:
    - image: kubin
      context: .
      docker:
        dockerfile: Dockerfile
  local:
    push: false
    useDockerCLI: true
    useBuildkit: true

deploy:
  helm:
    releases:
      - name: kubin-dev
        chartPath: charts/kubin
        namespace: kubin-dev
        createNamespace: true
        upgradeOnChange: true
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_kubin}}"
          image.tag: "{{.IMAGE_TAG_kubin}}"
        valuesFiles:
          - charts/kubin/values-dev.yaml
        wait: true

portForward:
  - resourceType: service
    resourceName: kubin-dev
    namespace: kubin-dev
    port: 8080
    localPort: 8080
